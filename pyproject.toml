[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-llm-gateway"
version = "0.5.0"
description = "A small configurable FastAPI gateway with request and response plugins"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.scripts]
llmgw = "gateway.cli:main"

[tool.setuptools.package-data]
"gateway.data" = ["*.json"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff==0.17.3", "mypy==2.4.1", "build==1.6.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.per-file-target-version]
"docs/deployment-tools/*.py" = "py310"
