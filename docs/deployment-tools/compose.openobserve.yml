services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.1.2@sha256:4a154849432f75c4fb024de32fe34163c02406c905dab22bf8d213d2e3386392
    ports:
      - "127.0.0.1:${OPENOBSERVE_LOCAL_PORT:-5080}:5080"
    environment:
      ZO_DATA_DIR: /data
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:?Set a private bootstrap account}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:?Set a private bootstrap password}
      ZO_TELEMETRY: "false"
      ZO_CREATE_ORG_THROUGH_INGESTION: "false"
      ZO_COMPACT_DATA_RETENTION_DAYS: "7"
    volumes:
      - openobserve-data:/data
    restart: unless-stopped

volumes:
  openobserve-data:
