<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Modular LLM Gateway container view</title>
<desc id="desc">One deployed gateway application. Dashed arrows show the planned real-provider adapter and operator-supplied company log collection. The fake provider and managed request workers are internal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="540" fill="#ffffff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
<text x="44" y="44" font-size="24" font-weight="bold">One application, explicit external boundaries</text>
<text x="44" y="73" font-size="15" fill="#475569">Current synthetic baseline; dashed integrations are not delivered adapters.</text>
<rect id="gateway" x="44" y="122" width="420" height="310" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
<text x="72" y="164" font-size="25" font-weight="bold">gateway</text>
<text x="72" y="194" font-size="18">Python 3.12 / FastAPI application</text>
<text x="72" y="235" font-size="16">HTTP JSON chat + /health</text>
<text x="72" y="266" font-size="16">Configured request / response plugins</text>
<text x="72" y="297" font-size="16">Internal deterministic fake provider</text>
<text x="72" y="328" font-size="16">Request-local workers (target)</text>
<text x="72" y="359" font-size="16">Memory: request state + bounded slots</text>
<text x="72" y="390" font-size="16">JSON events → logging handlers / stderr</text>
<rect id="provider" x="790" y="112" width="286" height="136" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="812" y="151" font-size="21" font-weight="bold">LLM provider</text>
<text x="812" y="181" font-size="15">External system</text>
<text x="812" y="210" font-size="15">Future real-provider adapter</text>
<rect id="logs" x="790" y="310" width="286" height="136" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
<text x="812" y="349" font-size="21" font-weight="bold">Company log store</text>
<text x="812" y="379" font-size="15">External system</text>
<text x="812" y="408" font-size="15">Operator supplies collection</text>
<path d="M 464 200 L 776 180" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="500" y="155" font-size="15">Planned HTTPS JSON</text>
<text x="500" y="177" font-size="15">chat request / reply</text>
<path d="M 464 370 L 776 378" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
<text x="500" y="328" font-size="15">JSON operating events</text>
<text x="500" y="350" font-size="15">via operator's collector</text>
<text x="44" y="489" font-size="15" fill="#475569">Blue = product application · Gray dashed = external boundary · Dashed arrow = planned / operator-supplied exchange</text>
<text x="44" y="515" font-size="15" fill="#475569">No external actor is shown here; actors remain in the product vision's system context.</text>
</g></svg>
