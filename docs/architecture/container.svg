<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="711" viewBox="0 0 1120 711" role="img" aria-labelledby="title desc">
  <title id="title">Modular LLM Gateway container view</title>
  <desc id="desc">One gateway application with optional integrations for a real provider, separate observability and analytics backends, and operator-managed lifecycle log collection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1120" height="711" fill="#ffffff"/>
  <g font-family="DejaVu Sans, sans-serif" fill="#0f172a">
    <text x="44" y="46" font-size="25" font-weight="bold">Modular LLM Gateway</text>
    <text x="44" y="73" font-size="15" fill="#475569">Container view · one product application with optional external integrations</text>

    <rect id="gateway" x="44" y="119" width="420" height="506" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="72" y="164" font-size="25" font-weight="bold">gateway</text>
    <text x="72" y="194" font-size="18">Python 3.12 / FastAPI application</text>
    <text x="72" y="238" font-size="16">HTTP JSON chat and health endpoints</text>
    <text x="72" y="269" font-size="16">Configured request and response plugins</text>
    <text x="72" y="300" font-size="16">Request-local workers and bounded slots</text>
    <text x="72" y="331" font-size="16">Internal deterministic fake provider</text>
    <text x="72" y="362" font-size="16">Optional DeepSeek provider adapter</text>
    <text x="72" y="393" font-size="16">Safe lifecycle events and request telemetry</text>
    <text x="72" y="424" font-size="16">Opt-in configured-chat usage events</text>

    <g fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5">
      <rect id="provider" x="790" y="119" width="286" height="112" rx="12"/>
      <rect id="observability" x="790" y="250" width="286" height="112" rx="12"/>
      <rect id="analytics" x="790" y="381" width="286" height="112" rx="12"/>
      <rect id="logs" x="790" y="512" width="286" height="112" rx="12"/>
    </g>
    <text x="812" y="154" font-size="21" font-weight="bold">DeepSeek</text>
    <text x="812" y="184" font-size="15">External model provider</text>
    <text x="812" y="285" font-size="21" font-weight="bold">OpenObserve</text>
    <text x="812" y="315" font-size="15">External observability backend</text>
    <text x="812" y="337" font-size="15">Self-hosted by the team</text>
    <text x="812" y="416" font-size="21" font-weight="bold">OpenObserve</text>
    <text x="812" y="446" font-size="15">External analytics backend</text>
    <text x="812" y="468" font-size="15">Self-hosted by the team</text>
    <text x="812" y="547" font-size="21" font-weight="bold">Company log store</text>
    <text x="812" y="577" font-size="15">External operator integration</text>

    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 464 181 H 776" marker-start="url(#arrow)"/>
      <path d="M 464 312 H 776"/>
      <path d="M 464 443 H 776"/>
      <path d="M 464 574 H 776" stroke-dasharray="8 5"/>
    </g>
    <text x="504" y="166" font-size="15">HTTPS JSON · chat / reply</text>
    <text x="504" y="297" font-size="15">OTLP/HTTP · logs and histogram</text>
    <text x="504" y="428" font-size="15">Authenticated HTTP(S) JSON</text>
    <text x="504" y="464" font-size="15">Configured usage events</text>
    <text x="504" y="559" font-size="15">Lifecycle JSON · operator collector</text>

    <text x="44" y="666" font-size="15" fill="#475569">Blue: product application · Dashed outline: external system · Dashed arrow: operator-supplied exchange</text>
    <text x="44" y="691" font-size="15" fill="#475569">The team self-hosts both backends using upstream OpenObserve. Telemetry is optional.</text>
  </g>
</svg>
