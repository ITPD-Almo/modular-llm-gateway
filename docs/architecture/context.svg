<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>System context: Modular LLM Gateway</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <style>.l { paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }</style>
  <rect width="860" height="520" fill="#ffffff"/>
  <!-- Product boundary -->
  <rect x="300" y="170" width="260" height="170" rx="6" fill="none" stroke="#1f6feb" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="430" y="192" text-anchor="middle" fill="#1f6feb" font-size="12">product boundary</text>
  <rect x="325" y="205" width="210" height="110" rx="8" fill="#dbeafe" stroke="#1f6feb" stroke-width="2"/>
  <text x="430" y="252" text-anchor="middle" font-weight="bold" fill="#111111">Modular LLM Gateway</text>
  <text x="430" y="274" text-anchor="middle" fill="#111111" font-size="12">core + policy plugins</text>
  <!-- Actors -->
  <rect x="30" y="60" width="190" height="70" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="125" y="90" text-anchor="middle" font-weight="bold" fill="#111111">Employee</text>
  <text x="125" y="110" text-anchor="middle" fill="#111111" font-size="12">via an internal tool (actor)</text>
  <rect x="30" y="390" width="190" height="70" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="1.5"/>
  <text x="125" y="420" text-anchor="middle" font-weight="bold" fill="#111111">IT operator</text>
  <text x="125" y="440" text-anchor="middle" fill="#111111" font-size="12">(actor)</text>
  <!-- External systems -->
  <rect x="640" y="60" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="90" text-anchor="middle" font-weight="bold" fill="#111111">LLM provider</text>
  <text x="735" y="110" text-anchor="middle" fill="#111111" font-size="12">(external system)</text>
  <rect x="640" y="390" width="190" height="70" rx="8" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="735" y="420" text-anchor="middle" font-weight="bold" fill="#111111">Company log store</text>
  <text x="735" y="440" text-anchor="middle" fill="#111111" font-size="12">(external system)</text>
  <!-- Flows -->
  <line x1="220" y1="105" x2="325" y2="225" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="145" fill="#111111" font-size="12" class="l">prompt + static credential</text>
  <line x1="325" y1="245" x2="200" y2="130" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="205" text-anchor="end" fill="#111111" font-size="12" class="l">response or rejection</text>
  <line x1="535" y1="225" x2="640" y2="105" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="590" y="150" text-anchor="end" fill="#111111" font-size="12" class="l">masked request</text>
  <line x1="660" y1="130" x2="535" y2="250" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="215" fill="#111111" font-size="12" class="l">model response</text>
  <line x1="200" y1="390" x2="325" y2="295" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="335" text-anchor="end" fill="#111111" font-size="12" class="l">policy file, plugins, credentials</text>
  <line x1="340" y1="315" x2="220" y2="415" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="400" fill="#111111" font-size="12" class="l">decision records</text>
  <line x1="535" y1="295" x2="640" y2="410" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="605" y="345" fill="#111111" font-size="12" class="l">decision records (no prompt text)</text>
</svg>
