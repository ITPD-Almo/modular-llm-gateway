name: Terminal installation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  install-and-demo:
    name: Install and demo (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Bootstrap without relying on runner Python or a Git checkout
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/gateway data"
          export GATEWAY_BIN_DIR="$RUNNER_TEMP/gateway bin"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ITPD-Almo/modular-llm-gateway/$SOURCE_REF/install.sh" -o gateway-install.sh
          sh gateway-install.sh --ref "$SOURCE_REF"
          "$GATEWAY_BIN_DIR/llmgw" --version
          "$GATEWAY_BIN_DIR/llmgw" doctor
          "$GATEWAY_BIN_DIR/llmgw" plugins
          "$GATEWAY_BIN_DIR/llmgw" init "$RUNNER_TEMP/external plugin"
          printf '\n# preserve this user edit\n' >> "$RUNNER_TEMP/external plugin/my_plugin.py"
          "$GATEWAY_BIN_DIR/llmgw" serve --config "$RUNNER_TEMP/external plugin/plugins.json" --port 18080 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in {1..30}; do
            if "$GATEWAY_BIN_DIR/llmgw" health --url http://127.0.0.1:18080; then ready=1; break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" -eq 1
          "$GATEWAY_BIN_DIR/llmgw" chat hello --url http://127.0.0.1:18080 > reply.json
          grep -q '"content": "BBBB"' reply.json
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT
          sh gateway-install.sh --ref "$SOURCE_REF" --no-demo
          grep -q 'preserve this user edit' "$RUNNER_TEMP/external plugin/my_plugin.py"
          if "$GATEWAY_BIN_DIR/llmgw" init "$RUNNER_TEMP/external plugin"; then
            echo 'ERROR: init overwrote an existing workspace'
            exit 1
          fi
          echo 'PASS: installer, isolated runtime, five HTTP scenarios, custom plugin, restart and safe repeat installation'
      - name: Verify guided key setup with synthetic keys and no external API calls
        shell: bash
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/gateway data"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error \
            "https://github.com/ITPD-Almo/modular-llm-gateway/archive/$SOURCE_REF.tar.gz" -o test-source.tar.gz
          mkdir test-source
          tar -xzf test-source.tar.gz -C test-source --strip-components=1
          if [ ! -f test-source/tests/test_provider_setup.py ]; then
            echo 'Guided setup is not included in this source ref; installer checks above remain the baseline.'
            exit 0
          fi
          uv="$XDG_DATA_HOME/llmgw/uv/uv"
          "$uv" venv --python "$XDG_DATA_HOME/llmgw/tools/modular-llm-gateway/bin/python" "$RUNNER_TEMP/guided-test-env"
          "$uv" pip install --python "$RUNNER_TEMP/guided-test-env/bin/python" \
            --constraint test-source/requirements-runtime.txt -e 'test-source[test]'
          cd test-source
          "$RUNNER_TEMP/guided-test-env/bin/python" -m pytest -q tests/test_provider_setup.py
